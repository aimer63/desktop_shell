name: desktop_shell
description: Unified Flutter desktop plugin for system tray and window management with explicit error handling
version: 0.1.0
homepage: https://github.com/aimer63/desktop_shell
publish_to: 'none'

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  path: ^1.8.0
  unwrap_me:
    git:
      url: https://github.com/aimer63/unwrap_me
      ref: master

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      linux:
        pluginClass: DesktopShellPlugin
      macos:
        pluginClass: DesktopShellPlugin
      windows:
        pluginClass: DesktopShellPlugin

